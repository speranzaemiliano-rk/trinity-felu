<main class="app">
  <!-- Inicio: escribir, hablar, la prueba y los temas -->
  <section id="pInicio" class="pantalla" hidden></section>
  <!-- Un tema: aprender (tocar y escuchar) y los botones para practicarlo -->
  <section id="pTema" class="pantalla" hidden></section>
  <!-- Una pregunta (de práctica, de la prueba o de hablar) -->
  <section id="pPreg" class="pantalla" hidden></section>
  <!-- Resultado de una ronda o de la prueba -->
  <section id="pFin" class="pantalla" hidden></section>
  <!-- «Mi prueba»: escrita + oral -->
  <section id="pPrueba" class="pantalla" hidden></section>
  <!-- Para grandes: voz, ayuda en castellano, IA, avance (se abre manteniendo apretado el engranaje) -->
  <section id="pAjustes" class="pantalla" hidden></section>
  <!-- Conversar: el profe pregunta lo básico (nombre, edad, cómo está, gustos…) y se contesta hablando -->
  <section id="pConv" class="pantalla" hidden></section>
  <noscript><p class="sin-js">Esta página necesita JavaScript para funcionar.</p></noscript>
</main>
